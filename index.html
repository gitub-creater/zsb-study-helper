    <script>
      // vercel.app 在中国大陆部分运营商网络会被拦截；能打开 Vercel 时转到
      // 已验证可达的 GitHub Pages，避免用户继续停留在不稳定的入口。
      if (/\.vercel\.app$/i.test(location.hostname)) {
        location.replace('https://gitub-creater.github.io/zsb-study-helper/' + location.search + location.hash)
      }
    </script>
    <script type="module" crossorigin src="./assets/index-Cmyi8b4Y.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CrONZMGw.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // localhost 下的开发模式不注册 SW(无哈希文件名会被 cache-first 永久扣住旧代码)
      if ('serviceWorker' in navigator && !/(localhost|127\.0\.0\.1)(:|$)/.test(location.hostname)) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('./sw.js').catch(function () {});
        });
      }
    </script>
  </body>
